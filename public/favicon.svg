<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Vector favicon: stays crisp on hi-dpi tabs and at any zoom, where the
       16/32px PNGs soften. Geometry is the BOLD variant from
       scripts/generate-icons.js, so this and favicon.ico are the same mark. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8f536" />
      <stop offset="1" stop-color="#7af0be" />
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="21.6" fill="url(#g)" />

  <circle cx="60" cy="60" r="39.6" fill="none" stroke="#0b0f0e" stroke-width="9.6" />
  <path d="M60 60 42.6 48.1" fill="none" stroke="#0b0f0e" stroke-width="8.4" stroke-linecap="round" />
  <path d="M60 60 75.8 41.8" fill="none" stroke="#0b0f0e" stroke-width="9.6" stroke-linecap="round" />

  <circle cx="90.9" cy="29.1" r="18" fill="#0b0f0e" />
  <circle cx="90.9" cy="29.1" r="9" fill="#d7ff3e" />
</svg>
